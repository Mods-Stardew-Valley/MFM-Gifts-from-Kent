[changelog]
header = """
# Changelog
Todas as mudanças importantes deste projeto serão documentadas neste arquivo.
"""
body = ""
footer = """
{% for release in releases | reverse %}
{% if release.version %}
## {{ release.version }} - {{ release.timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in release.commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
#### {{ commit.message }}
{% if commit.body %}
  └─ {{ commit.body | trim | replace(from="\n", to="\n     ") }}
{% endif %}
{% endfor %}
{% endfor %}
{% endfor %}
"""
trim = true
[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9]*"
ignore_tags = ""
topo_order = false
sort_commits = "newest"
commit_preprocessors = []
commit_parsers = [
    { message = "^feat", group = "✨ Novidades" },
    { message = "^fix", group = "🐛 Correções" },
    { message = "^perf", group = "⚡ Desempenho" },
    { message = "^refactor", group = "♻️ Refatoração" },
    { message = "^docs", group = "📚 Documentação" },
    { message = "^test", group = "🧪 Testes" },
    { message = "^release", group = "🏗 Versão" },
    { message = "^chore", group = "🔧 Manutenção" },
    { message = ".*", group = "Outras alterações" }
]